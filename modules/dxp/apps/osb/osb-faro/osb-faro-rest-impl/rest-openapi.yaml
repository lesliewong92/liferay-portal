                    type: boolean
            -   in: query
                description:
                    "Optional IndividualSegment id to restrict results to members of that segment."
                name: individualSegmentId
                schema:
                    type: string
            -   in: query
                description:
                    "Optional interest name to match."
                name: interestName
                schema:
                    type: string
            -   in: query
                description:
                    "1-based page number. Defaults to 1 when omitted."
                name: page
                schema:
                    type: integer
            -   in: query
                description:
                    "Page size. Defaults to the Faro engine's default when omitted (typically 20)."
                name: pageSize
                schema:
                    type: integer
            -   in: query
                description:
                    "Free-text search across name, email, and other Individual fields."
                name: search
                schema:
                    type: string
            -   in: query
                description:
                    "Sort expression, e.g. `lastActivityDate:desc`. Multiple fields comma-separated."
