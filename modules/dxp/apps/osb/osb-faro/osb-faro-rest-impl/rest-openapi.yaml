    "/sites/{siteId}/individual-segments":
        get:
            description:
                "List or search IndividualSegments under a site's FaroProject. Returns a paginated list of
                IndividualSegments (audiences) configured under a site's FaroProject. To fetch a single segment by id,
                use `getIndividualSegment`. To list the Individuals currently in a specific segment, use
                `getIndividualSegmentMembershipsPage`."
            operationId: getSiteIndividualSegmentsPage
            parameters:
            -   in: path
                description:
