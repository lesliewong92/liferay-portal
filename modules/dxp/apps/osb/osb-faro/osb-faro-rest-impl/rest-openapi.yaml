                description:
                    "Faro-internal identifier of the IndividualSegment whose memberships should be listed."
                name: individualSegmentId
                required: true
                schema:
                    type: string
            -   in: query
                description:
                    "1-based page number. Defaults to 1 when omitted."
                name: page
                schema:
                    type: integer
            -   in: query
                description:
                    "Page size. Defaults to the Faro engine's default when omitted (typically 20)."
                name: pageSize
                schema:
                    type: integer
