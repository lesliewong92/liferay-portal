    "/sites/{siteId}/individuals":
        get:
            description:
                "List or search Individuals (contacts) for a site's FaroProject. Returns a paginated list of Individuals
                (contacts) known to a site's FaroProject. Supports free-text search, OData-style filtering, and scoping
                by Account, Channel, DataSource, IndividualSegment, or interest. Use this for contact discovery,
                audience browsing, and 'find a person' queries. To fetch a single Individual by id (when you already
                have one), use `getIndividual` instead."
