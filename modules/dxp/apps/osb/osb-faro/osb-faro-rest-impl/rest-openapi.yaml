                    "Identifier of the Liferay site that owns the FaroProject."
                name: siteId
                required: true
                schema:
                    format: int64
                    type: integer
            -   in: query
                description:
                    "Optional Account id to restrict results to Individuals associated with that account."
                name: accountId
                schema:
                    type: string
            -   in: query
                description:
                    "Optional Channel id to scope results to a single channel."
                name: channelId
                schema:
                    type: string
            -   in: query
                description:
                    "Optional DataSource id to restrict results to Individuals sourced from that data source."
                name: dataSourceId
                schema:
                    type: string
