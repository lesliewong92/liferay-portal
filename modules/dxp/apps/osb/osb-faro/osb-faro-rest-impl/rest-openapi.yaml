        get:
            description:
                "List Individuals currently or formerly in a given segment. Returns a paginated list of memberships for
                an IndividualSegment. Each entry links one Individual to the segment and records when the Individual
                entered (and, if applicable, exited). Use the resulting `individualId` values with `getSiteIndividual`
                to retrieve the full Individual records."
