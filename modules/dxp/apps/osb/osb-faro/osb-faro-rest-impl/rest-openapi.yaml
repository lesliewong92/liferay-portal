components:
    schemas:
        Account:
            description:
                "A B2B account (company) tracked by the Faro Contacts engine. Accounts aggregate Individuals (contacts)
                employed by or associated with a single organization."
            properties:
                accountName:
                    description:
                        "Display name of the account (company name)."
                    readOnly: true
                    type: string
                annualRevenue:
                    description:
                        "Annual revenue of the account, when known. Currency is implied by the source data and not
                        normalized."
                    format: double
                    readOnly: true
                    type: number
                country:
                    description:
                        "ISO country name (not code) where the account is headquartered, when known."
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        "Last time the account record was modified in the Contacts engine."
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    description:
                        "Stable Faro-internal account identifier. Use this with `getAccount` to fetch the account
                        directly."
                    readOnly: true
                    type: string
                industry:
                    description:
                        "Industry classification of the account, e.g. 'Software', 'Manufacturing'. Free-form text from
                        the upstream data source."
                    readOnly: true
                    type: string
                lastActivityDate:
                    description:
                        "Most recent activity from any Individual associated with this account."
                    format: date-time
                    readOnly: true
                    type: string
                lifecycleStage:
                    description:
                        "Sales/marketing lifecycle stage of the account, e.g. 'Prospect', 'Customer'. Source-dependent."
                    readOnly: true
                    type: string
            type: object
        AssetSummaryMetric:
            description:
                "An aggregated set of analytics metrics for a single tracked asset (page, blog, document, form, journal,
                object entry, etc.) over the selected date range. Counts and trends are flattened from the underlying
                Cerebro Metric tree for LLM-friendly consumption — `*TrendPercentage` fields express change vs. the
                previous comparable period."
            properties:
                assetId:
                    description:
                        "Stable Cerebro-internal identifier of the tracked asset."
                    readOnly: true
                    type: string
                assetTitle:
                    description:
                        "Display title of the asset, e.g. the page title or blog post title."
                    readOnly: true
                    type: string
                assetType:
                    description:
                        "Asset category, e.g. 'BLOG', 'DOCUMENT', 'FORM', 'JOURNAL', 'OBJECT_ENTRY', 'PAGE'."
                    readOnly: true
                    type: string
                downloads:
                    description:
                        "Download count over the selected date range. Null when the asset type doesn't track downloads."
                    format: double
                    readOnly: true
                    type: number
                downloadsTrendPercentage:
                    description:
                        "Percentage change in downloads vs. the previous comparable period. Negative = decrease."
                    format: double
                    readOnly: true
                    type: number
                impressions:
                    description:
                        "Impression count (asset rendered into a viewport but not necessarily interacted with)."
                    format: double
                    readOnly: true
                    type: number
                impressionsTrendPercentage:
                    description:
                        "Percentage change in impressions vs. the previous comparable period."
                    format: double
                    readOnly: true
                    type: number
                reads:
                    description:
                        "Read count (full-content engagement, distinct from impressions)."
                    format: double
                    readOnly: true
                    type: number
                readsTrendPercentage:
                    description:
                        "Percentage change in reads vs. the previous comparable period."
                    format: double
                    readOnly: true
                    type: number
                views:
                    description:
                        "View count (asset opened/loaded by an individual)."
                    format: double
                    readOnly: true
                    type: number
                viewsTrendPercentage:
                    description:
                        "Percentage change in views vs. the previous comparable period."
                    format: double
                    readOnly: true
                    type: number
            type: object
        Channel:
            description:
                "A Faro Channel — a logical grouping of data sources (a website, an app, a CRM connection) under which
                Individuals, Activities, and Segments are scoped."
            properties:
                id:
                    description:
                        "Stable Faro-internal channel identifier."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Display name of the channel."
                    readOnly: true
                    type: string
            type: object
        Event:
            description:
                "A single tracked analytics event captured by the Cerebro engine — page views, custom events, form
                submissions, etc. Each event carries free-form `attributes` (a name→value map of contextual properties)
                plus any matching page metadata. To list events for a channel, use `getChannelEventsPage`."
            properties:
                applicationId:
                    description:
                        "Identifier of the application that emitted the event (e.g. the Cerebro analytics app)."
                    readOnly: true
                    type: string
                assetTitle:
                    description:
                        "Title of the asset associated with the event, when applicable."
                    readOnly: true
                    type: string
                attributes:
                    additionalProperties:
                        type: string
                    description:
                        "Free-form event properties as a name→value map. Keys are property names defined in
                        EventAttributeDefinition; values are stringified per their underlying data type. (Mapped from the
                        engine's repeated `properties: [{name, value}]` shape.)"
                    readOnly: true
                    type: object
                canonicalUrl:
                    description:
                        "Canonical URL of the page where the event was emitted, normalized for analytics joining."
                    readOnly: true
                    type: string
                createDate:
                    description:
                        "Timestamp when the event was recorded by the engine."
                    format: date-time
                    readOnly: true
                    type: string
                emailAddressHashed:
                    description:
                        "SHA-256 hash of the originating individual's email address, when known. Used for joining
                        without leaking PII. Null for anonymous individuals."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Event name as defined in EventDefinition (e.g. 'pageView', 'formSubmit', custom names)."
                    readOnly: true
                    type: string
                pageDescription:
                    description:
                        "Meta description of the page that emitted the event, when present."
                    readOnly: true
                    type: string
                pageKeywords:
                    description:
                        "Meta keywords of the page that emitted the event, comma-separated when multiple."
                    readOnly: true
                    type: string
                pageTitle:
                    description:
                        "Title of the page that emitted the event."
                    readOnly: true
                    type: string
                referrer:
                    description:
                        "Referring URL the visitor arrived from, when known."
                    readOnly: true
                    type: string
                url:
                    description:
                        "Actual URL of the page where the event was emitted (may differ from canonicalUrl)."
                    readOnly: true
                    type: string
            type: object
        FieldMapping:
            description:
                "A FieldMapping defines how a logical Faro field (e.g. an Individual attribute like 'jobTitle') is
                sourced from one or more underlying data sources. Inspect FieldMappings to discover what custom
                attributes exist on Individuals or Accounts in a given Faro project."
            properties:
                context:
                    description:
                        "The entity type the field is attached to. Common values: 'individual', 'account'."
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        "Last time this field mapping was modified."
                    format: date-time
                    readOnly: true
                    type: string
                displayName:
                    description:
                        "Human-readable name shown in Faro admin UI for this field."
                    readOnly: true
                    type: string
                displayType:
                    description:
                        "UI display hint, e.g. 'text', 'select'. Source for UI rendering decisions; not the data type."
                    readOnly: true
                    type: string
                fieldName:
                    description:
                        "Canonical (logical) name of the field. This is the name used in filter expressions and OData
                        queries."
                    readOnly: true
                    type: string
                fieldType:
                    description:
                        "Logical data type of the field: 'string', 'number', 'boolean', 'date', etc."
                    readOnly: true
                    type: string
                ownerType:
                    description:
                        "Sub-type of the owning entity, e.g. 'KNOWN' or 'ANONYMOUS' for Individuals."
                    readOnly: true
                    type: string
                repeatable:
                    description:
                        "True if this field can have multiple values per entity (e.g. tags). False for scalar fields."
                    readOnly: true
                    type: boolean
            type: object
        Individual:
            description:
                "A single contact (person) tracked by the Faro Contacts engine. Individuals are aggregated from website
                visitors, CRM contacts, and other data sources, and may be either 'known' (identified by email/account)
                or 'anonymous' (browser-tracked only)."
            properties:
                accountName:
                    description:
                        "Display name of the Account this Individual is primarily associated with, when known."
                    readOnly: true
                    type: string
                activitiesCount:
                    description:
                        "Total number of tracked activities (page views, events, etc.) attributed to this Individual."
                    format: int64
                    readOnly: true
                    type: integer
                dateCreated:
                    description:
                        "First time this Individual was observed by the Contacts engine."
                    format: date-time
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        "Last time this Individual's profile was modified by the Contacts engine (data import, profile
                        merge, attribute update)."
                    format: date-time
                    readOnly: true
                    type: string
                demographics:
                    additionalProperties:
                        items:
                            $ref: "#/components/schemas/IndividualDemographicField"
                        type: array
                    description:
                        "Per-category demographic attributes attached to this Individual. The map key is the demographic
                        category (e.g. 'profile', 'address', 'employment'), and each value is a list of attribute
                        records. Use `IndividualDemographicField.fieldType` to interpret each `value`."
                    readOnly: true
                    type: object
                firstActivityDate:
                    description:
                        "Date of the earliest tracked activity for this Individual."
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    description:
                        "Stable Faro-internal Individual identifier. Use this with `getIndividual` to fetch a single
                        Individual."
                    readOnly: true
                    type: string
                lastActivityDate:
                    description:
                        "Date of the most recent tracked activity for this Individual."
                    format: date-time
                    readOnly: true
                    type: string
                lastSessionCountry:
                    description:
                        "Country (ISO name) detected for the Individual's most recent session, derived from IP
                        geolocation when available."
                    readOnly: true
                    type: string
                profileType:
                    description:
                        "Either 'KNOWN' (identified by email/account) or 'ANONYMOUS' (browser-tracked only)."
                    readOnly: true
                    type: string
            type: object
        IndividualDemographicField:
            description:
                "A single demographic attribute attached to an Individual — e.g. job title, age, country. Sourced from
                an upstream data source (CRM, signup form, enrichment provider). Multiple attributes can share a
                category in `Individual.demographics`."
            properties:
                fieldType:
                    description:
                        "Logical data type of the value: 'string', 'number', 'boolean', 'date', etc. Use this to
                        interpret the `value` field."
                    readOnly: true
                    type: string
                label:
                    description:
                        "Human-readable label for the attribute, e.g. 'Job Title'."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Canonical attribute name, used in filter expressions and OData queries, e.g. 'jobTitle'."
                    readOnly: true
                    type: string
                value:
                    description:
                        "Attribute value, always serialized as a string. Use `fieldType` to convert to the appropriate
                        type."
                    readOnly: true
                    type: string
            type: object
        IndividualSegment:
            description:
                "A saved audience definition that selects Individuals matching a filter expression. Segments are how
                Faro groups contacts for targeting, reporting, and activation."
            properties:
                activeIndividualCount:
                    description:
                        "Number of Individuals currently in the segment whose membership is active."
                    format: int64
                    readOnly: true
                    type: integer
                anonymousIndividualCount:
                    description:
                        "Number of anonymous (browser-tracked, unidentified) Individuals in this segment."
                    format: int64
                    readOnly: true
                    type: integer
                channelId:
                    description:
                        "Identifier of the Channel this segment is scoped to. Cross-channel segments may have a null
                        channelId."
                    readOnly: true
                    type: string
                dateCreated:
                    description:
                        "When the segment was created."
                    format: date-time
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        "Last time the segment definition was modified."
                    format: date-time
                    readOnly: true
                    type: string
                filter:
                    description:
                        "OData-style filter expression that defines segment membership, e.g. `lastSessionCountry eq 'US'
                        and activitiesCount gt 5`."
                    readOnly: true
                    type: string
                id:
                    description:
                        "Stable Faro-internal segment identifier. Use this with `getIndividualSegment` to fetch a single
                        segment."
                    readOnly: true
                    type: string
                includeAnonymousUsers:
                    description:
                        "True if anonymous (unidentified) Individuals are eligible for membership in this segment."
                    readOnly: true
                    type: boolean
                individualCount:
                    description:
                        "Total Individuals in the segment, including inactive memberships."
                    format: int64
                    readOnly: true
                    type: integer
                knownIndividualCount:
                    description:
                        "Number of identified (non-anonymous) Individuals in this segment."
                    format: int64
                    readOnly: true
                    type: integer
                lastActivityDate:
                    description:
                        "Most recent activity by any Individual currently in the segment."
                    format: date-time
                    readOnly: true
                    type: string
                name:
                    description:
                        "Display name of the segment."
                    readOnly: true
                    type: string
                segmentType:
                    description:
                        "Either 'BATCH' (re-evaluated periodically) or 'REAL_TIME' (evaluated on each event)."
                    readOnly: true
                    type: string
                state:
                    description:
                        "Build state of the segment: 'READY', 'IN_PROGRESS', or 'DISABLED'."
                    readOnly: true
                    type: string
                status:
                    description:
                        "Lifecycle status of the segment: 'ACTIVE' or 'INACTIVE'."
                    readOnly: true
                    type: string
            type: object
        IndividualSegmentMembership:
            description:
                "A single Individual's membership in an IndividualSegment. Captures when the Individual entered the
                segment and (if applicable) when they exited."
            properties:
                dateCreated:
                    description:
                        "When the Individual entered the segment."
                    format: date-time
                    readOnly: true
                    type: string
                dateRemoved:
                    description:
                        "When the Individual exited the segment. Null if membership is still active."
                    format: date-time
                    readOnly: true
                    type: string
                individualId:
                    description:
                        "Identifier of the Individual whose membership this record describes. Use with `getIndividual`
                        to fetch the Individual."
                    readOnly: true
                    type: string
                individualSegmentId:
                    description:
                        "Identifier of the segment this membership belongs to."
                    readOnly: true
                    type: string
                status:
                    description:
                        "Either 'ACTIVE' (currently a member) or 'INACTIVE' (formerly a member)."
                    readOnly: true
                    type: string
            type: object
        PageMetric:
            description:
                "Analytics metrics for a single tracked Page over the selected date range. Aggregates view, visitor,
                bounce, and access-path metrics flattened from the Cerebro engine's Metric tree. Use `getSitePagesPage`
                to list these for a site."
            properties:
                assetId:
                    description:
                        "Stable Cerebro-internal identifier of the page."
                    readOnly: true
                    type: string
                assetTitle:
                    description:
                        "Display title of the page."
                    readOnly: true
                    type: string
                assetType:
                    description:
                        "Always 'PAGE' for results from this endpoint."
                    readOnly: true
                    type: string
                avgTimeOnPage:
                    description:
                        "Average time-on-page in seconds across all sessions in the date range."
                    format: double
                    readOnly: true
                    type: number
                bounceRate:
                    description:
                        "Fraction (0–1) of sessions that landed on this page and exited without further interaction."
                    format: double
                    readOnly: true
                    type: number
                dataSourceId:
                    description:
                        "Identifier of the data source providing this page's analytics events."
                    readOnly: true
                    type: string
                directAccess:
                    description:
                        "Visit count where this page was the entry point with no referrer (direct URL)."
                    format: double
                    readOnly: true
                    type: number
                entrances:
                    description:
                        "Total entrance count: sessions that started on this page (regardless of access type)."
                    format: double
                    readOnly: true
                    type: number
                exitRate:
                    description:
                        "Fraction (0–1) of sessions on which this page was the last page viewed before exit."
                    format: double
                    readOnly: true
                    type: number
                indirectAccess:
                    description:
                        "Visit count where this page was reached via a referrer (search engine, link, etc.)."
                    format: double
                    readOnly: true
                    type: number
                urls:
                    description:
                        "All distinct URLs that resolve to this page (canonical plus alternates), within the selected
                        date range."
                    items:
                        type: string
                    readOnly: true
                    type: array
                views:
                    description:
                        "Total page-view count over the selected date range."
                    format: double
                    readOnly: true
                    type: number
                viewsTrendPercentage:
                    description:
                        "Percentage change in views vs. the previous comparable period."
                    format: double
                    readOnly: true
                    type: number
                visitors:
                    description:
                        "Distinct visitor count (deduplicated by individual or session) over the date range."
                    format: double
                    readOnly: true
                    type: number
                visitorsTrendPercentage:
                    description:
                        "Percentage change in distinct visitors vs. the previous comparable period."
                    format: double
                    readOnly: true
                    type: number
            type: object
info:
    description:
        "Read-only headless REST API for Liferay Faro (Analytics Cloud / Experience Cloud). Exposes Individuals,
        IndividualSegments, Accounts, Channels, and FieldMappings from the Faro Contacts engine for use as MCP tools and
        external integrations. All endpoints are scoped to a Liferay site that has a provisioned FaroProject.. A Java
        client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.osb.faro.rest.client',
        and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Faro Headless REST API
    version: v1.0
    x-class-name: FaroRest
openapi: 3.0.1
paths:
    "/sites/{siteId}/accounts":
        get:
            description:
                "List or search Accounts known to a site's FaroProject. Returns a paginated list of Accounts (B2B
                companies) known to the Faro Contacts engine for a given site. Use this to browse or search Accounts by
                name. To fetch a single Account by id, use `getAccount`."
            operationId: getSiteAccountsPage
            parameters:
            -   in: path
                description:
                    "Identifier of the Liferay site that owns the FaroProject."
                name: siteId
                required: true
                schema:
                    format: int64
                    type: integer
            -   in: query
                description:
                    "Optional Channel id to scope results to a single channel."
                name: channelId
                schema:
                    type: string
            -   in: query
                description:
                    "1-based page number. Defaults to 1 when omitted."
                name: page
                schema:
                    type: integer
            -   in: query
                description:
                    "Page size. Defaults to the Faro engine's default when omitted (typically 20)."
                name: pageSize
                schema:
                    type: integer
            -   in: query
                description:
                    "Free-text search across account name and related fields."
                name: search
                schema:
                    type: string
            -   in: query
                description:
                    "Sort expression, e.g. `accountName:asc`. Multiple fields comma-separated."
                example: accountName:asc
                name: sort
                schema:
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Account"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Account"
                                type: array
            tags: ["Account"]
    "/sites/{siteId}/accounts/{accountId}":
        get:
            description:
                "Fetch a single Account from a site's FaroProject. Returns a single Account by id from a site's
                FaroProject. Use this when you already have an Account id from a previous call (e.g.
                `getSiteAccountsPage`). To search Accounts by name or filter, use `getSiteAccountsPage`."
            operationId: getSiteAccount
            parameters:
            -   in: path
                description:
                    "Identifier of the Liferay site that owns the FaroProject."
                name: siteId
                required: true
                schema:
                    format: int64
                    type: integer
            -   in: path
                description:
                    "Faro-internal identifier of the Account to fetch."
                name: accountId
                required: true
                schema:
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Account"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Account"
            tags: ["Account"]
    "/sites/{siteId}/asset-summaries":
        get:
            description:
                "List analytics asset summaries (page, blog, document, form, journal, object-entry) ranked by the
                requested sort metric, returning download/impression/read/view counts plus their period-over-period
                trend percentages. Use this to answer 'what content is performing best' and to pick assets for deeper
                drill-down via `getSitePagesPage` or asset-specific endpoints."
            operationId: getSiteAssetSummariesPage
            parameters:
                -   in: path
                    description:
                        "Identifier of the Liferay site that owns the FaroProject."
                    name: siteId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    description:
                        "Optional Channel id to scope results to a single channel."
                    name: channelId
                    schema:
                        type: string
                -   in: query
                    description:
                        "1-based page number."
                    name: page
                    schema:
                        type: integer
                -   in: query
                    description:
                        "Page size."
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    description:
                        "Custom range end as ISO datetime. Pair with rangeStart."
                    name: rangeEnd
                    schema:
                        type: string
                -   in: query
                    description:
                        "Date-range preset code understood by the Cerebro engine (e.g. 7 = LAST_7_DAYS, 30 =
                        LAST_30_DAYS). Mutually exclusive with rangeStart/rangeEnd; if provided, those are ignored."
                    name: rangeKey
                    schema:
                        format: int32
                        type: integer
                -   in: query
                    description:
                        "Custom range start as ISO datetime (e.g. 2026-01-01T00:00:00Z). Use with rangeEnd as a rangeKey
                        alternative."
                    name: rangeStart
                    schema:
                        type: string
                -   in: query
                    description:
                        "Free-text keyword search across asset titles. Empty/null returns all matching assets."
                    name: search
                    schema:
                        type: string
                -   in: query
                    description:
                        "Sort expression `column:asc|desc`. Defaults to `views:desc` when omitted. Common columns:
                        views, downloads, impressions, reads."
                    example: views:desc
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AssetSummaryMetric"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AssetSummaryMetric"
                                type: array
            tags: ["AssetSummaryMetric"]
    "/sites/{siteId}/channels":
        get:
            description:
                "List Channels configured under a site's FaroProject. Returns a paginated list of Channels configured
                under a site's FaroProject. To fetch a single Channel by id, use `getChannel`."
            operationId: getSiteChannelsPage
            parameters:
            -   in: path
                description:
                    "Identifier of the Liferay site that owns the FaroProject."
                name: siteId
                required: true
                schema:
                    format: int64
                    type: integer
            -   in: query
                description:
                    "1-based page number. Defaults to 1 when omitted."
                name: page
                schema:
                    type: integer
            -   in: query
                description:
                    "Page size. Defaults to the Faro engine's default when omitted (typically 20)."
                name: pageSize
                schema:
                    type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Channel"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Channel"
                                type: array
            tags: ["Channel"]
    "/sites/{siteId}/channels/{channelId}":
        get:
            description:
                "Fetch a single Channel from a site's FaroProject. Returns a single Channel by id from a site's
                FaroProject. A Channel is a logical grouping of data sources (a website, a CRM connection) under which
                Faro contacts and activities are scoped."
            operationId: getSiteChannel
            parameters:
            -   in: path
                description:
                    "Identifier of the Liferay site that owns the FaroProject."
                name: siteId
                required: true
                schema:
                    format: int64
                    type: integer
            -   in: path
                description:
                    "Faro-internal identifier of the Channel to fetch."
                name: channelId
                required: true
                schema:
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Channel"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Channel"
            tags: ["Channel"]
    "/sites/{siteId}/channels/{channelId}/events":
        get:
            description:
                "List tracked analytics events (page views, custom events, form submissions, etc.) for a specific
                channel, optionally narrowed to a single Individual or to a date range. Use this to inspect raw activity
                for a channel; for aggregated metrics across events, prefer `getSiteAssetSummariesPage` or
                `getSitePagesPage`."
            operationId: getSiteChannelEventsPage
            parameters:
                -   in: path
                    description:
                        "Identifier of the Liferay site that owns the FaroProject."
                    name: siteId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    description:
                        "Identifier of the Channel whose events should be listed."
                    name: channelId
                    required: true
                    schema:
                        type: string
                -   in: query
                    description:
                        "If true, include events from anonymous (browser-tracked, unidentified) individuals."
                    name: includeAnonymousUsers
                    schema:
                        type: boolean
                -   in: query
                    description:
                        "1-based page number."
                    name: page
                    schema:
                        type: integer
                -   in: query
                    description:
                        "Page size."
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    description:
