                    format: int64
                    type: integer
            -   in: query
                description:
                    "Optional Channel id to scope results to a single channel."
                name: channelId
                schema:
                    type: string
            -   in: query
                description:
                    "Optional segment name to match exactly."
                name: name
                schema:
                    type: string
            -   in: query
                description:
                    "1-based page number. Defaults to 1 when omitted."
                name: page
                schema:
                    type: integer
            -   in: query
                description:
                    "Page size. Defaults to the Faro engine's default when omitted (typically 20)."
