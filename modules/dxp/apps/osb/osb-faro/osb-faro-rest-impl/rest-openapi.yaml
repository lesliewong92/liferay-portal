    "/sites/{siteId}/field-mappings":
        get:
            description:
                "List FieldMappings to discover custom attributes in a FaroProject. Returns a paginated list of
                FieldMappings for a site's FaroProject. Use this to discover which custom Individual or Account
                attributes exist in a given project (e.g. before constructing a `filter` expression that references a
                custom field)."
            operationId: getSiteFieldMappingsPage
            parameters:
            -   in: path
                description:
                    "Identifier of the Liferay site that owns the FaroProject."
                name: siteId
                required: true
                schema:
                    format: int64
                    type: integer
            -   in: query
                description:
                    "Restrict results to a specific entity context, e.g. 'individual' or 'account'."
                name: context
                schema:
                    type: string
            -   in: query
                description:
                    "Filter by ownerType, e.g. 'KNOWN' or 'ANONYMOUS' for Individual contexts."
                name: ownerType
                schema:
                    type: string
            -   in: query
                description:
                    "1-based page number. Defaults to 1 when omitted."
                name: page
                schema:
                    type: integer
            -   in: query
                description:
                    "Page size. Defaults to the Faro engine's default when omitted (typically 20)."
                name: pageSize
                schema:
                    type: integer
            -   in: query
                description:
                    "Free-text search across displayName and fieldName."
                name: search
                schema:
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/FieldMapping"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/FieldMapping"
                                type: array
            tags: ["FieldMapping"]
    "/sites/{siteId}/field-mappings/{fieldMappingId}":
        get:
